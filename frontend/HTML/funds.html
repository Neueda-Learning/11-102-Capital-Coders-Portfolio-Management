<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Funds</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>


<div class="dashboard-container">



    <!-- Sidebar -->

    <aside class="sidebar">


        <div class="sidebar-logo">

            <h2>Portfolio MS</h2>

        </div>



        <nav>

            <ul>


                <li>
                    <a href="dashboard.html">
                        Dashboard
                    </a>
                </li>


                <li>
                    <a href="portfolios.html">
                        My Portfolios
                    </a>
                </li>


                <li>
                    <a href="investors.html">
                        Investors
                    </a>
                </li>


                <li>
                    <a href="funds.html" class="active">
                        Funds
                    </a>
                </li>


                <li>
                    <a href="assets.html">
                        Assets
                    </a>
                </li>


            </ul>

        </nav>


    </aside>









    <!-- Main Content -->

    <main class="main-content">



        <!-- Header -->


        <header class="header">


            <div>

                <h1>
                    Funds
                </h1>


                <p>
                    Manage investor funding rounds
                </p>


            </div>


        </header>









        <!-- Summary Cards -->


        <section class="summary-cards">



            <div class="card">


                <h3>
                    Total Funds Received
                </h3>


                <p id="totalFunds">
                    0
                </p>


            </div>





            <div class="card">


                <h3>
                    Funding Rounds
                </h3>


                <p id="totalRounds">
                    0
                </p>


            </div>





            <div class="card">


                <h3>
                    Available Funds
                </h3>


                <p id="availableFunds">
                    0
                </p>


            </div>



        </section>









        <!-- Add Funding Round Form -->


        <section class="form-section">


            <h2>
                Add Funding Round
            </h2>




            <form id="fundForm">





                <div class="form-group">


                    <label for="investor">

                        Investor

                    </label>


                    <select id="investor" required>


                        <option value="">

                            Select Investor

                        </option>


                        <!-- Loaded from API -->


                    </select>



                </div>








                <div class="form-group">


                    <label for="amount">

                        Funding Amount

                    </label>


                    <input
                            type="number"
                            id="amount"
                            placeholder="Enter amount"
                            required
                    >



                </div>








                <div class="form-group">


                    <label for="fundingDate">

                        Funding Date

                    </label>


                    <input
                            type="date"
                            id="fundingDate"
                            required
                    >



                </div>







                <button type="submit">

                    Add Funding

                </button>



            </form>



        </section>









        <!-- Funding Rounds Table -->


        <section class="table-section">



            <h2>
                Funding History
            </h2>





            <table>


                <thead>


                <tr>


                    <th>
                        Funding ID
                    </th>


                    <th>
                        Investor
                    </th>


                    <th>
                        Portfolio
                    </th>


                    <th>
                        Amount
                    </th>


                    <th>
                        Date
                    </th>


                </tr>


                </thead>





                <tbody id="fundTableBody">



                <!-- Data loaded using JavaScript -->


                <tr>


                    <td colspan="5">

                        No funding rounds available

                    </td>


                </tr>



                </tbody>



            </table>



        </section>





    </main>


</div>





<script src="js/config.js"></script>

<script src="js/funds.js"></script>


</body>


</html>
