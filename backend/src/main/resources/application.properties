spring.application.name=portfolio-management

# MySQL datasource
spring.datasource.url=jdbc:mysql://localhost:3306/portfolio_management?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username= {username}
spring.datasource.password= {password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# Run schema.sql and data.sql on startup (creates tables if missing)
spring.sql.init.mode=always
