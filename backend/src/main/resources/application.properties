spring.application.name=portfolio-management
server.port=${SERVER_PORT:8090}

# MySQL datasource
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/portfolio_management?allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:n3u3da!}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Run schema.sql and data.sql on startup (creates tables + seeds if missing)
spring.sql.init.mode=always

